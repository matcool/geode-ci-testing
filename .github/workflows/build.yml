name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - target: win
        - target: macm1
        - target: macintel
        # - target: mac
        - target: ios
        - target: android32
        - target: android64

    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./actions/build
        with:
          target: ${{ matrix.config.target }}
          upload: true
    
  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v7 # ignore this one
      - uses: ./actions/merge
        with:
          upload: true
          zstd: true
          optimize-pngs: true
