name: Build Geode Mod

on:
  workflow_dispatch:
  push:

env:
  IMAGE: ghcr.io/geode-sdk/geode:windows-6.0.0-alpha.2

jobs:
  build:
    name: Build Window
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/geode-sdk/geode:windows-6.0.0-alpha.2

    steps:
      - uses: actions/checkout@v7

      # - run: docker pull $IMAGE

      # - name: Configure and build
      #   run: |
      #     docker run --rm -v ./:/src -w /src $IMAGE bash -c "cmake --preset win --presets-file /docker/CMakePresets.json && cmake --build --preset win --presets-file /docker/CMakePresets.json --parallel"
      #     sudo chown -R $(id -u):$(id -g) build-win/

      - name: Configure
        run: cmake --preset win --presets-file /docker/CMakePresets.json

      - name: Build
        run: cmake --build --preset win --presets-file /docker/CMakePresets.json --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: build-win
          path: build-win/*.geode