name: Build Geode Mod

on:
  workflow_dispatch:
  push:

env:
  IMAGE: ghcr.io/geode-sdk/geode:windows-6.0.0-alpha.2

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare image
        run: docker run -d --name builder -v ./:/src -w /src "$IMAGE" sleep infinity

      - name: Configure
        run: docker exec builder cmake --preset win --presets-file /docker/CMakePresets.json

      - name: Build
        run: |
          docker exec builder cmake --build --preset win --presets-file /docker/CMakePresets.json --parallel
          sudo chown -R $(id -u):$(id -g) build-*/

      - uses: actions/upload-artifact@v7
        with:
          name: build-win
          path: build-win/*.geode