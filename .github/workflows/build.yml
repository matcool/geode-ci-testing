name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - image: windows
          preset: win

        - image: macos
          preset: macm1

        - image: macos
          preset: macintel

        - image: ios
          preset: ios

        - image: android
          preset: android32

        - image: android
          preset: android64

    name: Build ${{ matrix.config.preset }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./actions/build
        with:
          image: ${{ matrix.config.image }}
          preset: ${{ matrix.config.preset }}
    
  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: ./actions/merge
        with:
          upload: true
          zstd: true
          optimize-pngs: true
