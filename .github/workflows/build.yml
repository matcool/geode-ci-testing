name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - image: windows
          preset: win

        - image: macos
          preset: macm1

        - image: macos
          preset: macintel

        - image: ios
          preset: ios

        - image: android
          preset: android32

        - image: android
          preset: android64

    name: Build ${{ matrix.config.preset }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: |
            /cpm-cache
            /sccache
          key: cpm-${{ matrix.config.preset }}-${{ github.sha }}
          restore-keys: |
            cpm-${{ matrix.config.preset }}-

      - name: Prepare image
        run: |
          docker run -d \
            --name builder \
            -v ./:/src -w /src \
            -b /cpm-cache:/cpm-cache \
            -b /sccache:/opt/sccache/cache \
            "ghcr.io/geode-sdk/geode:${{ matrix.config.image }}-6.0.0-alpha.2" \
            sleep infinity

      - name: fix bindings
        run: docker exec builder bash -c "cd /bindings && git pull"

      - name: Configure
        run: |
          LTO=${{ matrix.config.preset == 'win' && '-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON' || '' }}
          docker exec builder cmake --preset ${{ matrix.config.preset }}-cache --presets-file /docker/CMakePresets.json $LTO

      - name: Build
        run: docker exec builder cmake --build --preset ${{ matrix.config.preset }}-cache --presets-file /docker/CMakePresets.json --parallel

      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.config.preset }}
          path: build-${{ matrix.config.preset }}/*.geode
          if-no-files-found: error
