name: Build Geode mod
description: Builds a Geode mod

inputs:
  # sdk:
  #   description: Which version of the SDK to use, defaults to latest release. Set to 'given' to use the version specified in mod.json, 'nightly' for latest commit, 'latest' for latest release
  #   required: false
  #   default: given

  configure-args:
    description: Extra arguments passed to CMake when configuring.
    required: false
    default: ""

  build-args:
    description: Extra arguments passed to CMake when building.
    required: false
    default: ""

  path:
    description: Path to the project which to build. Defaults to current directory.
    required: false
    default: ./

  target:
    required: true

  upload:
    default: false

runs:
  using: composite
  steps:
    - name: Detect target
      id: platform
      shell: bash
      run: |
        TARGET="${{ inputs.target }}"
        LTO=""
        if [ "$TARGET" = "android32" ] || [ "$TARGET" = "android64" ]; then
          IMAGE="android"
        elif [ "$TARGET" = "win" ]; then
          IMAGE="windows"
          LTO="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
        elif [ "$TARGET" = "ios" ]; then
          IMAGE="ios"
        elif [ "$TARGET" = "mac" ] || [ "$TARGET" = "macm1" ] || [ "$TARGET" = "macintel" ]; then
          IMAGE="macos"
        else
          echo "Unknown target $TARGET"
          exit 1
        fi
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "lto=$LTO" >> $GITHUB_OUTPUT
        echo "name=$TARGET" >> $GITHUB_OUTPUT

    - name: Setup Cache
      uses: actions/cache@v6
      with:
        path: ~/cache
        key: build-${{ inputs.target }}-${{ github.sha }}
        restore-keys: |
          build-${{ inputs.target }}-

    - name: Prepare image
      shell: bash
      run: |
        mkdir -p ~/cache/cpm ~/cache/scc
        cd "${{ inputs.path }}"
        docker run -d \
          --name builder \
          -v ./:/src -w /src \
          -v ~/cache/cpm:/cpm-cache \
          -v ~/cache/scc:/opt/sccache/cache \
          "ghcr.io/geode-sdk/geode:${{ steps.platform.outputs.image }}-6.0.0-alpha.2" \
          sleep infinity

    - name: fix bindings
      shell: bash
      run: docker exec builder bash -c "cd /bindings && git pull"

    - name: Configure
      shell: bash
      run: |
        LTO="${{ steps.platform.outputs.lto }}"
        docker exec builder cmake \
          --preset ${{ inputs.target }}-cache --presets-file /docker/CMakePresets.json \
          $LTO -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

    - name: Build
      shell: bash
      run: |
        docker exec builder cmake --build \
          --preset ${{ inputs.target }}-cache --presets-file /docker/CMakePresets.json \
          --parallel

    - name: Fix ownership
      shell: bash
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" "${{ inputs.path }}" ~/cache

    - uses: actions/upload-artifact@v7
      if: ${{ inputs.upload }}
      with:
        name: build-${{ steps.platform.outputs.name }}
        path: |
          build-${{ steps.platform.outputs.name }}/*.geode
          build-${{ steps.platform.outputs.name }}/*.pdb
          build-${{ steps.platform.outputs.name }}/*.sym
          build-${{ steps.platform.outputs.name }}/*.dbg
          build-${{ steps.platform.outputs.name }}/*.dSYM
        if-no-files-found: error