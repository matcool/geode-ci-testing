name: Build Geode mod
description: Builds a Geode mod

inputs:
  target:
    description: One of win, android32, android64, mac, macintel, macm1, ios.
    required: true

  sdk:
    description: Which version of the SDK to use. Set to 'given' to use the version specified in mod.json, 'nightly' for latest commit, 'latest' for latest release
    required: false
    default: given

  configure-args:
    description: Extra arguments passed to CMake when configuring.
    required: false
    default: ""

  build-args:
    description: Extra arguments passed to CMake when building.
    required: false
    default: ""

  build-config:
    description: Which build configuration to use, can only be Release or RelWithDebInfo. Defaults to Release
    required: false
    default: Release

  path:
    description: Path to the project which to build. Defaults to current directory.
    required: false
    default: ./

  upload:
    description: Automatically upload built files as geode-build-(platform).zip
    default: false

  bindings:
    description: What repository to use for bindings. Must be in the format "user/repo"
    required: false
    default: "geode-sdk/bindings"

  bindings-ref:
    description: Which commit/branch to use for bindings. Defaults to latest commit in main branch
    required: false
    default: ""

  use-action-cache:
    description: Whether to use actions cache for CPM and sccache
    default: true

  save-action-cache:
    description: Whether to save actions cache, can be useful to disable on PRs and such.
    default: true

  use-lto:
    description: Whether to use LTO (Link Time Optimization) via the CMAKE_INTERPROCEDURAL_OPTIMIZATION flag, improving build size. Defaults to true
    required: false
    default: true

  export-debug:
    description: Whether to export debug files for builds (.pdb for Windows, .dbg for Android, .dSYM for MacOS). Defaults to false
    required: false
    default: false

  export-symbols:
    description: Whether to export Breakpad symbols for Android builds. Defaults to false
    required: false
    default: false

  export-pdb:
    description: Whether to export PDB files for Windows builds. Defaults to false
    required: false
    default: false

  bundle-pdb:
    description: Whether to bundle PDB files into the .geode package. Requires SDK v4.2.0 and CLI v3.3.0 at minimum. Defaults to false
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Detect target
      id: platform
      shell: bash
      run: |
        TARGET="${{ inputs.target }}"
        BUILD="build-$TARGET"
        if [ "$TARGET" = "android32" ] || [ "$TARGET" = "android64" ]; then
          PLATFORM="android"
          BINARIES="$TARGET"
        elif [ "$TARGET" = "win" ]; then
          PLATFORM="windows"
          BINARIES="windows"
        elif [ "$TARGET" = "ios" ]; then
          PLATFORM="ios"
          BINARIES="ios"
        elif [ "$TARGET" = "mac" ] || [ "$TARGET" = "macm1" ] || [ "$TARGET" = "macintel" ]; then
          PLATFORM="macos"
          BINARIES="macos"
        else
          echo "Unknown target $TARGET"
          exit 1
        fi

        LTO=""
        if [ "${{ inputs.use-lto }}" = "true" ]; then
          # ios and macos dont have lto just yet
          if [ "$PLATFORM" = "windows" ] || [ "$PLATFORM" = "android" ]; then
            LTO="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
          fi
        fi

        PRESET="$TARGET"
        if [ "${{ inputs.build-config }}" = "RelWithDebInfo" ]; then
          PRESET="$PRESET-debug"
        fi

        if [ "${{ inputs.sdk }}" == "nightly" ]; then
          echo "image=tools:$PLATFORM-latest" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.sdk }}" == "latest" ]; then
          TARGET_GEODE_VERSION=$(curl https://api.geode-sdk.org/v1/loader/versions/latest?prerelease=true | jq -r .payload.version)
          echo "Targetting Geode version $TARGET_GEODE_VERSION"
          echo "image=geode:$PLATFORM-${TARGET_GEODE_VERSION/#v}" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.sdk }}" == "given" ]; then
          MOD_JSON_PATH=$(find ${{ inputs.path }} -name "mod.json" -print | sort -r | head -n 1)
          TARGET_GEODE_VERSION=$(jq -r '.geode' $MOD_JSON_PATH)
          echo "Targetting Geode version $TARGET_GEODE_VERSION from $MOD_JSON_PATH"
          echo "image=geode:$PLATFORM-${TARGET_GEODE_VERSION/#v}" >> $GITHUB_OUTPUT
        else
          TARGET_GEODE_VERSION="${{ inputs.sdk }}"
          echo "Targetting Geode version $TARGET_GEODE_VERSION"
          echo "image=geode:$PLATFORM-${TARGET_GEODE_VERSION/#v}" >> $GITHUB_OUTPUT
        fi

        if [ -z "$TARGET_GEODE_VERSION" ]; then
          echo "TARGET_GEODE_VERSION is empty, probably failed to find Geode version from a mod.json :("
          exit 1
        fi

        echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
        echo "binaries=$BINARIES" >> $GITHUB_OUTPUT
        echo "lto=$LTO" >> $GITHUB_OUTPUT
        echo "name=$TARGET" >> $GITHUB_OUTPUT
        echo "build_folder=$BUILD" >> $GITHUB_OUTPUT
        echo "preset=$PRESET" >> $GITHUB_OUTPUT

    - name: Compute CPM cache key
      id: cpm-key
      shell: bash
      run: echo "key=cpm-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/mod.json') }}" >> "$GITHUB_OUTPUT"

    - name: Restore CPM cache
      id: cpm-cache
      uses: actions/cache/restore@v6
      if: ${{ inputs.use-action-cache == 'true' }}
      with:
        path: ~/cache/cpm
        key: ${{ steps.cpm-key.outputs.key }}
        restore-keys: |
          cpm-

    - name: Restore sccache cache
      uses: actions/cache/restore@v6
      if: ${{ inputs.use-action-cache == 'true' }}
      with:
        path: ~/cache/scc
        key: sccache-${{ inputs.target }}-${{ github.sha }}
        restore-keys: |
          sccache-${{ inputs.target }}-

    - name: Download bindings repo
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.bindings }}
        ref: "${{ inputs.bindings-ref }}"
        path: bindings-repo-clone

    - name: Prepare image
      shell: bash
      run: |
        mkdir -p ~/cache/cpm ~/cache/scc
        cd "${{ inputs.path }}"
        docker run -d \
          --name builder \
          -e SCCACHE_CACHE_SIZE=1G \
          -v ./:/src -w /src \
          -v ~/cache/cpm:/cpm-cache \
          -v ~/cache/scc:/opt/sccache/cache \
          -v "$GITHUB_WORKSPACE/bindings-repo-clone:/bindings" \
          "ghcr.io/geode-sdk/${{ steps.platform.outputs.image }}" \
          sleep infinity

    - name: Setup SDK manually
      shell: bash
      if: ${{ inputs.sdk == 'nightly' }}
      run: |
        docker exec -i builder bash -es <<'EOF'
        curl -Lf https://raw.githubusercontent.com/geode-sdk/geode-docker/refs/heads/main/docker/CMakePresets.json -o /docker/CMakePresets.json
        git clone https://github.com/geode-sdk/geode.git --branch nightly --depth 1 /opt/geode
        geode config set sdk-nightly true
        geode sdk install-binaries -p ${{ steps.platform.outputs.binaries }}
        EOF

    - name: Configure
      shell: bash
      run: |
        set -x

        LTO="${{ steps.platform.outputs.lto }}"
        BUNDLE_PDB=""
        if [ "${{ inputs.bundle-pdb }}" = "true" ] && [ "${{ inputs.target }}" = "win" ]; then
          BUNDLE_PDB="-DGEODE_BUNDLE_PDB=ON"
        fi

        docker exec builder cmake \
          --preset ${{ steps.platform.outputs.preset }} --presets-file /docker/CMakePresets.json \
          $LTO $BUNDLE_PDB -DCMAKE_CXX_SCAN_FOR_MODULES=OFF ${{ inputs.configure-args }} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      shell: bash
      run: |
        set -x

        docker exec builder cmake --build \
          --preset ${{ steps.platform.outputs.preset }} --presets-file /docker/CMakePresets.json \
          --parallel ${{ inputs.build-args }}

    # --user id:ig breaks the geode docker image atm, so do this
    - name: Fix ownership
      shell: bash
      if: ${{ !cancelled() }}
      run: sudo chown -R "$(id -u):$(id -g)" "${{ inputs.path }}" ~/cache

    - name: Cache stats
      shell: bash
      run: |
        du -sh ~/cache/scc ~/cache/cpm
        docker exec builder sccache -s

    - name: Install dump_syms
      if: inputs.export-symbols == 'true' && steps.platform.outputs.platform == 'android'
      shell: bash
      run: |
        mkdir -p /tmp/dump_syms
        cd /tmp/dump_syms
        curl -L https://github.com/mozilla/dump_syms/releases/latest/download/dump_syms-x86_64-unknown-linux-gnu.tar.xz -o dump_syms.tar.xz
        xz -d dump_syms.tar.xz
        tar -xf dump_syms.tar
        echo "/tmp/dump_syms/dump_syms-x86_64-unknown-linux-gnu" >> $GITHUB_PATH

    - name: Move built files
      shell: bash
      run: |
        set -x

        rm -rf /tmp/output/
        mkdir -p /tmp/output

        cd ${{ inputs.path }}

        BUILD="./${{ steps.platform.outputs.build_folder }}"

        for file in $(find $BUILD -name *.geode); do
          cp $file /tmp/output/
          if [ "${{ inputs.export-symbols }}" = "true" ] && [ "${{ steps.platform.outputs.platform }}" = "android" ]; then
            SO_FILE=( $(dirname $file)/$(basename $file .geode).*.so )
            SO_FILE_NAME=$(basename $SO_FILE)
            if [ -f "$SO_FILE" ]; then
              dump_syms "$SO_FILE" -o "/tmp/output/$SO_FILE_NAME.sym"
            fi
          fi
        done

        if [ "${{ inputs.target }}" = "win" ] && [ "${{ inputs.export-pdb }}" = "true" ]; then
          for file in $(find $BUILD -name *.pdb); do
            cp $file /tmp/output
          done
        fi

        if [ "${{ inputs.export-debug }}" = "true" ]; then
          for file in $(find $BUILD -name *.pdb); do
            cp $file /tmp/output
          done
          for file in $(find $BUILD -name *.dbg); do
            cp $file /tmp/output
          done
          for dir in $(find $BUILD -name *.dSYM); do
            cp -R $dir /tmp/output
          done
        fi

    - name: Remove container
      shell: bash
      if: ${{ !cancelled() }}
      run: docker rm -f builder

    - name: Save sccache
      if: ${{ !cancelled() && inputs.use-action-cache == 'true' && inputs.save-action-cache == 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ~/cache/scc
        key: sccache-${{ inputs.target }}-${{ github.sha }}

    - name: Save CPM cache
      if: ${{ !cancelled() && inputs.use-action-cache == 'true' && inputs.save-action-cache == 'true' && steps.cpm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ~/cache/cpm
        key: ${{ steps.cpm-key.outputs.key }}

    - uses: actions/upload-artifact@v7
      if: ${{ inputs.upload == 'true' }}
      with:
        name: geode-build-${{ steps.platform.outputs.name }}
        path: |
          /tmp/output/*.geode
          /tmp/output/*.pdb
          /tmp/output/*.sym
          /tmp/output/*.dbg
          /tmp/output/*.dSYM
        if-no-files-found: error
